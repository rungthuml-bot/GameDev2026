<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="../coi-serviceworker.js"></script>
  <title>Lab 03 — Game Dev 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#0a0e1a;--surface:#111827;--border:rgba(99,102,241,0.12);--border-hover:rgba(99,102,241,0.35);--text:#e2e8f0;--text-dim:#94a3b8;--accent:#6366f1;--accent-light:#818cf8;--accent-glow:rgba(99,102,241,0.15);--cyan:#22d3ee}
    body{font-family:'Outfit','Noto Sans Thai',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
    .top-bar{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.5rem;background:linear-gradient(135deg,var(--surface),#1a2236);border-bottom:1px solid var(--border)}
    .back-link{display:inline-flex;align-items:center;gap:.5rem;color:var(--accent-light);text-decoration:none;font-weight:500;font-size:.9rem;transition:all .3s ease;padding:.4rem .9rem;border-radius:8px;background:var(--accent-glow);border:1px solid var(--border)}
    .back-link:hover{background:rgba(99,102,241,.18);border-color:var(--border-hover);gap:.7rem}
    .back-link svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
    .back-link:hover svg{transform:translateX(-3px)}
    .lab-title{font-size:1rem;font-weight:600;display:flex;align-items:center;gap:.5rem}
    .lab-title .badge{padding:.2rem .6rem;background:var(--accent-glow);border:1px solid var(--border);border-radius:6px;font-size:.72rem;color:var(--accent-light);font-weight:500}
    .game-frame{flex:1;width:100%;border:none;display:block}
  </style>
</head>
<body>
  <div class="top-bar">
    <a href="../index.html" class="back-link"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>กลับหน้าหลัก</a>
    <div class="lab-title"><span class="badge">LAB 03</span> 2D RPG Movement</div>
  </div>
  <iframe src="Lab-03.html" class="game-frame" allowfullscreen></iframe>
</body>
</html>
