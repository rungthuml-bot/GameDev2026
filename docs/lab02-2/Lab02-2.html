<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 02-2 — Game Dev 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --blue-400: #60a5fa;
      --blue-500: #3b82f6;
      --blue-600: #2563eb;
      --sky-400: #38bdf8;
      --cyan-400: #22d3ee;
      --slate-100: #f1f5f9;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
    }

    body {
      font-family: 'Outfit', 'Noto Sans Thai', sans-serif;
      background: var(--slate-900);
      color: var(--slate-100);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 50%, rgba(59,130,246,0.08) 0%, transparent 70%);
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 600px;
      padding: 2rem;
    }

    .icon-box {
      width: 100px;
      height: 100px;
      margin: 0 auto 2rem;
      background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(14,165,233,0.1));
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 1rem;
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 999px;
      font-size: 0.8rem;
      color: var(--sky-400);
      margin-bottom: 1.5rem;
      font-weight: 500;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
      line-height: 1.2;
    }

    h1 .gradient {
      background: linear-gradient(135deg, var(--blue-400), var(--sky-400), var(--cyan-400));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--slate-400);
      line-height: 1.7;
      margin-bottom: 2.5rem;
      font-weight: 300;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.5rem;
      background: rgba(251,191,36,0.1);
      border: 1px solid rgba(251,191,36,0.25);
      border-radius: 12px;
      font-size: 0.9rem;
      color: #fbbf24;
      font-weight: 600;
      margin-bottom: 2rem;
    }

    .status-chip .dot {
      width: 8px;
      height: 8px;
      background: #fbbf24;
      border-radius: 50%;
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--blue-400);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      padding: 0.5rem 1.25rem;
      border-radius: 10px;
      background: rgba(59,130,246,0.06);
      border: 1px solid rgba(59,130,246,0.1);
    }

    .back-link:hover {
      background: rgba(59,130,246,0.12);
      border-color: rgba(59,130,246,0.3);
      gap: 0.75rem;
    }

    .back-link svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.3s ease;
    }

    .back-link:hover svg {
      transform: translateX(-3px);
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="container">
    <div class="icon-box">🔧</div>
    <div class="badge">LAB 02-2</div>
    <h1><span class="gradient">Lab 02-2</span></h1>
    <p class="subtitle">
      เนื้อหาของ Lab 02 ส่วนที่ 2 — กำลังเตรียมพร้อม<br>
      จะอัปเดตเมื่อมีไฟล์โปรเจกต์จาก Godot Engine
    </p>
    <div class="status-chip">
      <span class="dot"></span>
      Coming Soon
    </div>
    <br><br>
    <a href="index.html" class="back-link">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      กลับหน้าหลัก
    </a>
  </div>
</body>
</html>
